name: pages
# Token-free site build on GitHub-hosted runners, so the site deploys even when the Mini is offline.
on:
  push:
    branches: [main]
    paths: ["content/**", "data/**", "site/**", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run site:build
      - name: Size budget (Pages limit 1 GB, budget 900 MB)
        run: |
          size=$(du -sm site/dist | cut -f1)
          echo "site/dist: $size MB"
          test "$size" -lt 900
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
