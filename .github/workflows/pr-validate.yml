name: pr-validate
# GitHub-hosted only: pull-request code never reaches the Mini. No secrets, no LLM (LLM_CACHE_ONLY=1).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LLM_CACHE_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate:sources
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:workflows
      - run: npm run validate:content
      # no vault on GitHub-hosted runners: policy checks only; the Mini runs the shingle scan before every commit
      - run: npm run check:leak -- --policy-only
