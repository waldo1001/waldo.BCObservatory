# BC Observatory source registry.
# Add your blog or channel with a pull request. Validation: npm run validate:sources (schemas/sources.json + policy rules).
# Rules: tier is official only for Microsoft-owned sources. full_text: true needs tier official OR a consent block
# that points at the pull request where the author opted in. Everything else is stored as summary + short quotes + links.
version: 1
defaults:
  tier: community
  full_text: false
  language: en
  backfill:
    months: 18
  enabled: true

sources:
  # ---------------------------------------------------------------- official: Microsoft Learn (CC BY 4.0)
  - id: learn-smb-docs
    kind: docs-git
    name: Microsoft Learn - Business Central business functionality
    url: https://learn.microsoft.com/dynamics365/business-central/
    tier: official
    full_text: true
    repo: MicrosoftDocs/dynamics365smb-docs
    branch: main
    paths: [business-central/]
    license: CC-BY-4.0
    backfill: { all: true }
  - id: learn-devitpro
    kind: docs-git
    name: Microsoft Learn - Business Central developer and IT pro
    url: https://learn.microsoft.com/dynamics365/business-central/dev-itpro/
    tier: official
    full_text: true
    repo: MicrosoftDocs/dynamics365smb-devitpro-pb
    branch: main
    paths: [dev-itpro/]
    license: CC-BY-4.0
    backfill: { all: true }

  # ---------------------------------------------------------------- official: roadmap (release plans retired Sept 2026)
  - id: m365-roadmap
    kind: roadmap-api
    name: Microsoft 365 / AI at Work roadmap - Business Central items
    url: https://www.microsoft.com/microsoft-365/roadmap
    tier: official
    full_text: true
    fetch:
      api: https://www.microsoft.com/releasecommunications/api/v1/m365
      feed: https://www.microsoft.com/releasecommunications/api/v1/m365/rss
      product_filter: Dynamics 365 Business Central

  # ---------------------------------------------------------------- official: guidelines
  - id: bcquality
    kind: guidelines-git
    name: microsoft/BCQuality knowledge base
    url: https://github.com/microsoft/BCQuality
    tier: official
    full_text: true
    repo: microsoft/BCQuality
    branch: main
    paths: [microsoft/, community/]
    license: MIT
  - id: alguidelines
    kind: guidelines-git
    name: microsoft/alguidelines (alguidelines.dev) - link index only
    url: https://alguidelines.dev
    tier: official
    full_text: false
    repo: microsoft/alguidelines
    branch: main
    paths: [content/]
    license: MIT
    mode: links-only

  # ---------------------------------------------------------------- official: source code
  - id: bcapps
    kind: code-git
    name: microsoft/BCApps
    url: https://github.com/microsoft/BCApps
    tier: official
    full_text: false
    repo: microsoft/BCApps
    license: MIT
    mode: metadata-only
  - id: sandbox-history
    kind: code-git
    name: StefanMaron/MSDyn365BC.Sandbox.Code.History
    url: https://github.com/StefanMaron/MSDyn365BC.Sandbox.Code.History
    tier: official
    full_text: false
    repo: StefanMaron/MSDyn365BC.Sandbox.Code.History
    license: none
    mode: metadata-only
  - id: onprem-history
    kind: code-git
    name: StefanMaron/MSDyn365BC.Code.History
    url: https://github.com/StefanMaron/MSDyn365BC.Code.History
    tier: official
    full_text: false
    repo: StefanMaron/MSDyn365BC.Code.History
    license: none
    mode: metadata-only

